<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Roy — Risk Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080f;
  --glass:rgba(255,255,255,0.04);
  --glass2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.14);
  --text:#eef0f8;
  --muted:rgba(255,255,255,0.38);
  --accent:#6c63ff;
  --up:#22c55e;
  --up-glow:rgba(34,197,94,0.25);
  --down:#ef4444;
  --down-glow:rgba(239,68,68,0.25);
  --flat:#eab308;
  --flat-glow:rgba(234,179,8,0.22);
  --radius:16px;
  --radius-sm:10px;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── Animated bg ── */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── Layout ── */
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 1.25rem 3rem}

/* ── Header ── */
header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(24px);
  background:rgba(7,8,15,0.75);
  border-bottom:1px solid var(--border);
  padding:1rem 1.25rem;
}
.header-inner{
  max-width:1400px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;
}
.logo{font-size:18px;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.backend-badge{
  display:flex;align-items:center;gap:6px;
  font-size:12px;padding:5px 12px;border-radius:99px;
  border:1px solid var(--border2);background:var(--glass);
  cursor:default;
}
.badge-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;transition:background .3s}
.badge-dot.online{background:var(--up);box-shadow:0 0 8px var(--up)}
.refresh-time{font-size:12px;color:var(--muted)}
.btn-test{
  font-size:12px;padding:5px 14px;border-radius:99px;
  border:1px solid var(--border2);background:var(--glass);
  color:var(--text);cursor:pointer;transition:background .15s;
}
.btn-test:hover{background:var(--glass2)}

/* ── Account bar ── */
.account-bar{
  background:var(--glass);border:1px solid var(--border);
  border-radius:var(--radius);padding:1rem 1.5rem;
  display:flex;align-items:center;gap:2rem;flex-wrap:wrap;
  margin:1.5rem 0 1rem;
}
.account-bar label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
.account-bar input{
  background:transparent;border:none;border-bottom:1px solid var(--border2);
  color:var(--text);font-size:22px;font-weight:700;width:120px;outline:none;padding:2px 0;
  letter-spacing:-.02em;
}
.account-meta{font-size:13px;color:var(--muted);margin-left:auto}
.account-meta span{color:var(--text);font-weight:600}

/* ── Grid ── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:1.25rem;
}

/* ── Card ── */
.card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.25rem;
  transition:box-shadow .4s,border-color .4s;
  backdrop-filter:blur(12px);
}
.card.up{box-shadow:0 0 28px var(--up-glow);border-color:rgba(34,197,94,.25)}
.card.down{box-shadow:0 0 28px var(--down-glow);border-color:rgba(239,68,68,.25)}
.card.flat{box-shadow:0 0 22px var(--flat-glow);border-color:rgba(234,179,8,.22)}

/* ── Card header ── */
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:1rem}
.logo-wrap{
  width:42px;height:42px;border-radius:10px;
  background:var(--glass2);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
}
.logo-wrap img{width:28px;height:28px;object-fit:contain}
.logo-wrap .fallback{font-size:13px;font-weight:800;color:var(--accent)}
.card-name{flex:1;min-width:0}
.card-ticker{font-size:18px;font-weight:800;letter-spacing:-.02em;font-family:'SF Mono','Fira Code',monospace}
.card-company{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Price section ── */
.price-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:.6rem}
.price-current{font-size:28px;font-weight:800;letter-spacing:-.03em;font-family:'SF Mono','Fira Code',monospace}
.price-arrow{font-size:22px;font-weight:700;line-height:1}
.price-arrow.up{color:var(--up)}
.price-arrow.down{color:var(--down)}
.price-arrow.flat{color:var(--flat)}
.price-change{font-size:14px;font-weight:600;align-self:center}
.price-change.up{color:var(--up)}
.price-change.down{color:var(--down)}
.price-change.flat{color:var(--flat)}
.price-open{font-size:12px;color:var(--muted);margin-bottom:.9rem}
.price-open span{color:var(--text);font-weight:600}

/* ── Risk inputs ── */
.risk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.9rem}
.risk-field label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
.risk-field input{
  width:100%;background:var(--glass2);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text);
  font-size:14px;font-weight:600;padding:7px 10px;outline:none;
  font-family:'SF Mono','Fira Code',monospace;transition:border-color .15s;
}
.risk-field input:focus{border-color:var(--accent)}
.risk-summary{
  font-size:12px;color:var(--muted);
  background:var(--glass2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:.9rem;
  line-height:1.7;
}
.risk-summary .val{color:var(--text);font-weight:600}
.risk-warn{
  font-size:12px;color:#fb923c;
  background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.25);
  border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:.9rem;
  display:none;
}

/* ── Analyst ── */
.analyst-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.analyst-rows{display:flex;flex-direction:column;gap:5px;margin-bottom:.9rem}
.analyst-row{display:flex;align-items:center;gap:8px}
.analyst-label{font-size:12px;width:32px;color:var(--muted)}
.analyst-bar-bg{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.analyst-bar-fill{height:100%;border-radius:99px;transition:width .6s}
.analyst-buy .analyst-bar-fill{background:var(--up)}
.analyst-hold .analyst-bar-fill{background:var(--flat)}
.analyst-sell .analyst-bar-fill{background:var(--down)}
.analyst-count{font-size:12px;font-weight:600;width:20px;text-align:right}

/* ── News ── */
.news-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.news-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.news-list a{
  font-size:12px;color:rgba(255,255,255,.7);text-decoration:none;
  display:block;line-height:1.5;
  border-left:2px solid var(--border2);padding-left:8px;
  transition:color .15s,border-color .15s;
}
.news-list a:hover{color:#fff;border-color:var(--accent)}
.news-empty{font-size:12px;color:var(--muted);font-style:italic}

/* ── Alert history ── */
.alerts-section{margin-top:2rem}
.alerts-title{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.75rem}
.alerts-list{display:flex;flex-direction:column;gap:8px}
.alert-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 14px;border-radius:var(--radius-sm);
  border:1px solid transparent;font-size:13px;
}
.alert-stop{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.2);color:#fca5a5}
.alert-target{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.2);color:#86efac}
.alert-size{background:rgba(251,146,60,.1);border-color:rgba(251,146,60,.2);color:#fdba74}
.alert-time{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;padding-left:8px}
.no-alerts{font-size:13px;color:var(--muted);padding:.5rem 0}

/* ── Loading skeleton ── */
.skeleton{background:linear-gradient(90deg,var(--glass) 25%,var(--glass2) 50%,var(--glass) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;height:14px;margin:4px 0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Toast ── */
#toast{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;
  background:#1a1a2e;border:1px solid var(--border2);
  border-radius:var(--radius-sm);padding:12px 18px;
  font-size:13px;max-width:320px;
  transform:translateY(100px);opacity:0;transition:all .3s;
  pointer-events:none;
}
#toast.show{transform:translateY(0);opacity:1}

footer{text-align:center;padding:2rem 0 1rem;font-size:12px;color:var(--muted);position:relative;z-index:1}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="toast"></div>

<header>
  <div class="header-inner">
    <div class="logo">Rocket Roy</div>
    <div class="header-right">
      <div class="backend-badge" id="backendBadge">
        <div class="badge-dot" id="badgeDot"></div>
        <span id="badgeLabel">Backend offline</span>
      </div>
      <span class="refresh-time" id="refreshTime">—</span>
      <button class="btn-test" onclick="testEmail()">✉ Test email</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="account-bar">
    <div>
      <label>Account size</label>
      <input type="number" id="accountSize" value="150" min="1" placeholder="150">
    </div>
    <div class="account-meta">
      Max risk/trade: <span id="maxRisk">£1.50</span> &nbsp;·&nbsp;
      Max/position: <span id="maxPos">£30.00</span>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="alerts-section">
    <div class="alerts-title">Alert history</div>
    <div class="alerts-list" id="alertHistory"><div class="no-alerts">No alerts triggered yet.</div></div>
  </div>
</div>

<footer>Not financial advice · Magnificent 7 Risk Dashboard · Prices via Finnhub</footer>

<script>
const FINNHUB_KEY = 'da6r941r01qqqkkgsvm0';
const BACKEND     = 'http://localhost:5001';
const REFRESH_MS  = 30000;

const STOCKS = [
  { ticker:'AAPL',  name:'Apple Inc.',        logo:'https://www.google.com/s2/favicons?domain=apple.com&sz=128' },
  { ticker:'MSFT',  name:'Microsoft Corp.',   logo:'https://www.google.com/s2/favicons?domain=microsoft.com&sz=128' },
  { ticker:'GOOGL', name:'Alphabet Inc.',     logo:'https://www.google.com/s2/favicons?domain=google.com&sz=128' },
  { ticker:'AMZN',  name:'Amazon.com Inc.',   logo:'https://www.google.com/s2/favicons?domain=amazon.com&sz=128' },
  { ticker:'NVDA',  name:'Nvidia Corp.',      logo:'https://www.google.com/s2/favicons?domain=nvidia.com&sz=128' },
  { ticker:'META',  name:'Meta Platforms',    logo:'https://www.google.com/s2/favicons?domain=meta.com&sz=128' },
  { ticker:'TSLA',  name:'Tesla Inc.',        logo:'https://www.google.com/s2/favicons?domain=tesla.com&sz=128' },
];

let state = {};
let alertHistory = [];
let backendOnline = false;
let positions = {};

STOCKS.forEach(s => {
  state[s.ticker] = { price: null, open: null, analyst: null, news: [] };
  positions[s.ticker] = { buyPrice: '', shares: '' };
});

/* ── Animated starfield ── */
(function(){
  const c = document.getElementById('bg'), ctx = c.getContext('2d');
  let W, H, stars = [], mouse = {x:-999,y:-999};
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  function init(){
    stars=[];
    for(let i=0;i<180;i++) stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.3+.2,
      vx:(Math.random()-.5)*.1, vy:(Math.random()-.5)*.1,
      a:Math.random()*.5+.1
    });
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.x+=s.vx; s.y+=s.vy;
      if(s.x<0)s.x=W; if(s.x>W)s.x=0;
      if(s.y<0)s.y=H; if(s.y>H)s.y=0;
      const dx=s.x-mouse.x,dy=s.y-mouse.y,d=Math.sqrt(dx*dx+dy*dy);
      const g=d<130?1-d/130:0;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r+g*1.8,0,Math.PI*2);
      ctx.fillStyle=`rgba(${g>.1?'160,140,255':'190,190,240'},${s.a+g*.5})`;
      ctx.fill();
    });
    stars.forEach((a,i)=>{
      for(let j=i+1;j<stars.length;j++){
        const b=stars[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<110){
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
          ctx.strokeStyle=`rgba(108,99,255,${.18*(1-d/110)})`;
          ctx.lineWidth=.5;ctx.stroke();
        }
      }
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
  window.addEventListener('resize',()=>{resize();init()});
  resize();init();draw();
})();

/* ── Helpers ── */
const fmt  = n => '£'+Math.abs(n).toFixed(2);
const fmtP = n => (n>=0?'+':'')+n.toFixed(2)+'%';
const now  = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

function toast(msg, dur=3000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

function addAlert(type, ticker, msg){
  const item = {type, ticker, msg, time: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
  alertHistory.unshift(item);
  if(alertHistory.length>20) alertHistory.pop();
  renderAlertHistory();
}

function renderAlertHistory(){
  const el = document.getElementById('alertHistory');
  if(!alertHistory.length){ el.innerHTML='<div class="no-alerts">No alerts triggered yet.</div>'; return; }
  el.innerHTML = alertHistory.map(a=>`
    <div class="alert-item alert-${a.type}">
      <strong>${a.ticker}</strong>: ${a.msg}
      <span class="alert-time">${a.time}</span>
    </div>`).join('');
}

/* ── Account ── */
function getAccount(){ return parseFloat(document.getElementById('accountSize').value)||150; }

function updateAccountMeta(){
  const acc = getAccount();
  document.getElementById('maxRisk').textContent = fmt(acc*0.01);
  document.getElementById('maxPos').textContent  = fmt(acc*0.20);
}

/* ── Risk engine ── */
function checkRisk(ticker){
  const p = positions[ticker];
  const s = state[ticker];
  if(!p.buyPrice||!p.shares||!s.price) return;
  const buy=parseFloat(p.buyPrice), shares=parseFloat(p.shares), price=s.price, acc=getAccount();
  if(!buy||!shares) return;

  const maxRisk    = acc*0.01;
  const stopLoss   = buy*0.93;
  const target     = buy*1.14;
  const posRisk    = shares*buy*0.07;

  // Position size warning
  if(posRisk > maxRisk){
    const maxShares = Math.floor(maxRisk/(buy*0.07));
    const warnEl = document.getElementById(`warn-${ticker}`);
    if(warnEl){
      warnEl.style.display='block';
      warnEl.textContent=`⚠ Position oversized for 1% risk rule. Max shares: ${maxShares} (risk: ${fmt(posRisk)} vs limit ${fmt(maxRisk)}).`;
    }
    sendBackendAlert(ticker,'size',`Position oversized. Risk ${fmt(posRisk)} exceeds 1% limit ${fmt(maxRisk)}. Suggested max: ${maxShares} shares.`);
  } else {
    const warnEl = document.getElementById(`warn-${ticker}`);
    if(warnEl) warnEl.style.display='none';
  }

  // Stop loss
  if(price <= stopLoss && !p.stopFired){
    p.stopFired = true;
    const msg = `STOP LOSS — ${ticker} at ${fmt(price)}, down ${Math.abs(((price-buy)/buy*100)).toFixed(1)}% from buy ${fmt(buy)}. Sell now, don't hesitate.`;
    addAlert('stop', ticker, `Stop loss triggered at ${fmt(price)}`);
    sendBackendAlert(ticker,'stop',msg);
    toast(`🔴 STOP LOSS: ${ticker}`);
  }

  // Target
  if(price >= target && !p.targetFired){
    p.targetFired = true;
    const msg = `2:1 TARGET HIT — ${ticker} at ${fmt(price)}, up ${((price-buy)/buy*100).toFixed(1)}% from buy ${fmt(buy)}. Consider taking profit.`;
    addAlert('target', ticker, `2:1 target hit at ${fmt(price)}`);
    sendBackendAlert(ticker,'target',msg);
    toast(`💰 TARGET HIT: ${ticker}`);
  }
}

/* ── Backend comms ── */
async function pingBackend(){
  try{
    const r = await fetch(`${BACKEND}/ping`,{signal:AbortSignal.timeout(2000)});
    const d = await r.json();
    backendOnline = d.ok===true;
  } catch(e){ backendOnline=false; }
  document.getElementById('badgeDot').className = 'badge-dot'+(backendOnline?' online':'');
  document.getElementById('badgeLabel').textContent = backendOnline?'Backend online':'Backend offline';
}

async function sendBackendAlert(ticker, type, message){
  if(!backendOnline) return;
  try{
    await fetch(`${BACKEND}/alert`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ticker,type,message,account:getAccount()})
    });
  } catch(e){}
}

async function syncPositions(){
  if(!backendOnline) return;
  try{
    await fetch(`${BACKEND}/positions`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({positions,accountSize:getAccount()})
    });
  } catch(e){}
}

async function testEmail(){
  if(!backendOnline){ toast('Backend is offline — start alert_service.py first.'); return; }
  try{
    const r = await fetch(`${BACKEND}/test-email`,{method:'POST'});
    const d = await r.json();
    toast(d.ok?'✅ Test email sent! Check your inbox.':'❌ Email failed — check SMTP config.');
  } catch(e){ toast('❌ Could not reach backend.'); }
}

/* ── Finnhub fetching ── */
async function fetchQuote(ticker){
  try{
    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`);
    return await r.json();
  } catch(e){ return null; }
}

async function fetchAnalyst(ticker){
  try{
    const r = await fetch(`https://finnhub.io/api/v1/stock/recommendation?symbol=${ticker}&token=${FINNHUB_KEY}`);
    const d = await r.json();
    return d&&d.length?d[0]:null;
  } catch(e){ return null; }
}

async function fetchNews(ticker){
  try{
    const to   = new Date().toISOString().split('T')[0];
    const from = new Date(Date.now()-7*86400000).toISOString().split('T')[0];
    const r = await fetch(`https://finnhub.io/api/v1/company-news?symbol=${ticker}&from=${from}&to=${to}&token=${FINNHUB_KEY}`);
    const d = await r.json();
    return Array.isArray(d)?d.slice(0,5):[];
  } catch(e){ return []; }
}

/* ── Render ── */
function dirClass(price, open){
  if(!open||price===open) return 'flat';
  return price>open?'up':'down';
}

function arrow(cls){ return cls==='up'?'▲':cls==='down'?'▼':'↕'; }

function renderCard(stock){
  const s = state[stock.ticker];
  const p = positions[stock.ticker];
  const cls = (s.price&&s.open)?dirClass(s.price,s.open):'flat';
  const chg = (s.price&&s.open)?((s.price-s.open)/s.open*100):0;

  // Analyst totals
  let buy=0,hold=0,sell=0,total=0;
  if(s.analyst){ buy=s.analyst.buy||0; hold=s.analyst.hold||0; sell=s.analyst.sell||0; total=buy+hold+sell||1; }

  // Risk summary
  const acc = getAccount();
  const buyP = parseFloat(p.buyPrice)||0;
  const shares = parseFloat(p.shares)||0;
  const stop = buyP?fmt(buyP*0.93):'—';
  const target = buyP?fmt(buyP*1.14):'—';
  const maxRisk = fmt(acc*0.01);

  return `
  <div class="card ${cls}" id="card-${stock.ticker}">
    <div class="card-head">
      <div class="logo-wrap">
        <img src="${stock.logo}" alt="${stock.ticker}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="fallback" style="display:none">${stock.ticker.slice(0,2)}</div>
      </div>
      <div class="card-name">
        <div class="card-ticker">${stock.ticker}</div>
        <div class="card-company">${stock.name}</div>
      </div>
    </div>

    <div class="price-row">
      <div class="price-current">${s.price?'$'+s.price.toFixed(2):'—'}</div>
      <div class="price-arrow ${cls}">${arrow(cls)}</div>
      <div class="price-change ${cls}">${s.price&&s.open?fmtP(chg):''}</div>
    </div>
    <div class="price-open">Open: <span>${s.open?'$'+s.open.toFixed(2):'—'}</span></div>

    <div class="risk-grid">
      <div class="risk-field">
        <label>Buy price ($)</label>
        <input type="number" id="buy-${stock.ticker}" value="${p.buyPrice}" placeholder="0.00" step="0.01" min="0"
          oninput="onPositionChange('${stock.ticker}')">
      </div>
      <div class="risk-field">
        <label>Shares held</label>
        <input type="number" id="shares-${stock.ticker}" value="${p.shares}" placeholder="0" step="1" min="0"
          oninput="onPositionChange('${stock.ticker}')">
      </div>
    </div>

    <div class="risk-warn" id="warn-${stock.ticker}"></div>

    <div class="risk-summary">
      Stop: <span class="val">${stop}</span> &nbsp;·&nbsp;
      Target: <span class="val">${target}</span> &nbsp;·&nbsp;
      Max risk: <span class="val">${maxRisk}</span>
    </div>

    <div class="analyst-title">Analyst consensus</div>
    <div class="analyst-rows">
      <div class="analyst-row analyst-buy">
        <span class="analyst-label">Buy</span>
        <div class="analyst-bar-bg"><div class="analyst-bar-fill" style="width:${total?buy/total*100:0}%"></div></div>
        <span class="analyst-count">${buy}</span>
      </div>
      <div class="analyst-row analyst-hold">
        <span class="analyst-label">Hold</span>
        <div class="analyst-bar-bg"><div class="analyst-bar-fill" style="width:${total?hold/total*100:0}%"></div></div>
        <span class="analyst-count">${hold}</span>
      </div>
      <div class="analyst-row analyst-sell">
        <span class="analyst-label">Sell</span>
        <div class="analyst-bar-bg"><div class="analyst-bar-fill" style="width:${total?sell/total*100:0}%"></div></div>
        <span class="analyst-count">${sell}</span>
      </div>
    </div>

    <div class="news-title">Recent news</div>
    <ul class="news-list">
      ${s.news.length
        ? s.news.map(n=>`<li><a href="${n.url}" target="_blank" rel="noopener">${n.headline}</a></li>`).join('')
        : '<li class="news-empty">No recent news.</li>'}
    </ul>
  </div>`;
}

function renderAll(){
  document.getElementById('grid').innerHTML = STOCKS.map(renderCard).join('');
  updateAccountMeta();
  STOCKS.forEach(s=>checkRisk(s.ticker));
}

/* ── Position change handler ── */
function onPositionChange(ticker){
  positions[ticker].buyPrice = document.getElementById(`buy-${ticker}`).value;
  positions[ticker].shares   = document.getElementById(`shares-${ticker}`).value;
  // Re-arm alerts on change
  positions[ticker].stopFired   = false;
  positions[ticker].targetFired = false;
  savePositions();
  updateCardRisk(ticker);
  checkRisk(ticker);
  syncPositions();
}

function updateCardRisk(ticker){
  const p = positions[ticker];
  const buyP = parseFloat(p.buyPrice)||0;
  const acc  = getAccount();
  const stop = buyP?fmt(buyP*0.93):'—';
  const tgt  = buyP?fmt(buyP*1.14):'—';
  const risk = fmt(acc*0.01);
  const el   = document.querySelector(`#card-${ticker} .risk-summary`);
  if(el) el.innerHTML=`Stop: <span class="val">${stop}</span> &nbsp;·&nbsp; Target: <span class="val">${tgt}</span> &nbsp;·&nbsp; Max risk: <span class="val">${risk}</span>`;
}

/* ── Persistence ── */
function savePositions(){ try{ localStorage.setItem('mag7_pos',JSON.stringify(positions)); localStorage.setItem('mag7_acc',document.getElementById('accountSize').value); }catch(e){} }
function loadPositions(){
  try{
    const p = localStorage.getItem('mag7_pos');
    if(p) positions = JSON.parse(p);
    const a = localStorage.getItem('mag7_acc');
    if(a) document.getElementById('accountSize').value = a;
  }catch(e){}
}

/* ── Main refresh loop ── */
async function refreshAll(){
  document.getElementById('refreshTime').textContent = 'Updating...';
  await pingBackend();

  // Fetch all in parallel
  await Promise.all(STOCKS.map(async stock=>{
    const [quote, analyst, news] = await Promise.all([
      fetchQuote(stock.ticker),
      fetchAnalyst(stock.ticker),
      fetchNews(stock.ticker),
    ]);
    if(quote){ state[stock.ticker].price=quote.c; state[stock.ticker].open=quote.o; }
    if(analyst) state[stock.ticker].analyst = analyst;
    if(news) state[stock.ticker].news = news;
  }));

  renderAll();
  document.getElementById('refreshTime').textContent = `Updated ${now()}`;
}

/* ── Init ── */
loadPositions();
renderAll();
refreshAll();
setInterval(refreshAll, REFRESH_MS);

document.getElementById('accountSize').addEventListener('input',()=>{
  updateAccountMeta();
  savePositions();
  STOCKS.forEach(s=>{ updateCardRisk(s.ticker); checkRisk(s.ticker); });
});
</script>
</body>
</html>
